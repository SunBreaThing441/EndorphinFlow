<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="400" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Subtle tech pattern -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1.5">
    <line x1="0" y1="80" x2="1100" y2="80"/>
    <line x1="0" y1="160" x2="1100" y2="160"/>
    <line x1="0" y1="240" x2="1100" y2="240"/>
    <line x1="0" y1="320" x2="1100" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- WebRTC Connected Mesh Logo -->
  <g transform="translate(300, 200)">
    <!-- Interconnecting lines -->
    <line x1="-75" y1="-55" x2="75" y2="-55" stroke="#475569" stroke-width="6"/>
    <line x1="75" y1="-55" x2="95" y2="45" stroke="#475569" stroke-width="6"/>
    <line x1="95" y1="45" x2="-55" y2="55" stroke="#475569" stroke-width="6"/>
    <line x1="-55" y1="55" x2="-75" y2="-55" stroke="#475569" stroke-width="6"/>
    <line x1="-75" y1="-55" x2="95" y2="45" stroke="#475569" stroke-width="5"/>
    <line x1="75" y1="-55" x2="-55" y2="55" stroke="#475569" stroke-width="5"/>

    <!-- Top-Left Node (Blue) -->
    <circle cx="-75" cy="-55" r="32" fill="#0284c7" filter="url(#nodeGlow)"/>
    <circle cx="-75" cy="-55" r="16" fill="#ffffff"/>
    <circle cx="-75" cy="-55" r="8" fill="#0284c7"/>

    <!-- Top-Right Node (Orange) -->
    <circle cx="75" cy="-55" r="32" fill="#ea580c" filter="url(#nodeGlow)"/>
    <circle cx="75" cy="-55" r="16" fill="#ffffff"/>
    <circle cx="75" cy="-55" r="8" fill="#ea580c"/>

    <!-- Bottom-Right Node (Green) -->
    <circle cx="95" cy="45" r="32" fill="#16a34a" filter="url(#nodeGlow)"/>
    <circle cx="95" cy="45" r="16" fill="#ffffff"/>
    <circle cx="95" cy="45" r="8" fill="#16a34a"/>

    <!-- Bottom-Left Node (Purple) -->
    <circle cx="-55" cy="55" r="32" fill="#9333ea" filter="url(#nodeGlow)"/>
    <circle cx="-55" cy="55" r="16" fill="#ffffff"/>
    <circle cx="-55" cy="55" r="8" fill="#9333ea"/>
  </g>

  <!-- Typography -->
  <text x="470" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="2">
    Web<tspan fill="#38bdf8">RTC</tspan>
  </text>
  <text x="475" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="5">
    REAL-TIME COMMUNICATION
  </text>
</svg>
